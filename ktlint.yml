# ============================================================================
# AppCloneX KtLint 自定义规则配置
# 与 .editorconfig 配合使用，提供额外的规则集配置
# ============================================================================

# 规则集版本
version: 1.0.0

# ---------------------------------------------------------------------------
# 自定义规则集
# ---------------------------------------------------------------------------
rulesets:
  # 标准规则集（由 ktlint_standard 在 .editorconfig 中控制）
  standard:
    # 导入排序规则
    import-ordering:
      # 自定义导入排序：Android SDK -> 第三方库 -> 项目内部
      layout: "*,java.**,javax.**,kotlin.**,^"

  # 实验性规则集
  experimental:
    # 注释格式化
    comment-wrapping:
      max-line-length: 120

# ---------------------------------------------------------------------------
# 编辑器配置覆盖
# ---------------------------------------------------------------------------
editorconfig:
  # 覆盖特定规则的严重级别
  overrides:
    # 将 no-wildcard-imports 降级为警告（在测试代码中）
    - rule: no-wildcard-imports
      severity: warning
      exclude:
        - "**/test/**"
        - "**/androidTest/**"

    # 将 max-line-length 降级为警告（KDoc 链接等场景）
    - rule: max-line-length
      severity: warning
      exclude:
        - "**/test/**"

# ---------------------------------------------------------------------------
# 排除文件/目录
# ---------------------------------------------------------------------------
exclusions:
  # 构建生成目录
  - "**/build/**"
  - "**/.gradle/**"
  # 生成的代码
  - "**/generated/**"
  - "**/gen/**"
  # 第三方代码
  - "**/third_party/**"
