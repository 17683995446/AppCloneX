name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 缓存 Gradle（加速后续构建）
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 4. 赋予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 编译 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 6. 上传 APK 产物
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCloneX-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build  # Debug 构建成功后才构建 Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 生成签名密钥（仅用于测试，正式版请使用 GitHub Secrets）
      - name: Generate Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" > keystore.b64 && base64 -d keystore.b64 > app/release.keystore
        if: env.KEYSTORE_BASE64 != null

      # 编译 Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        if: env.KEYSTORE_BASE64 != null

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
        if: env.KEYSTORE_BASE64 == null

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCloneX-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
